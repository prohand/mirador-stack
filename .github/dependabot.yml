#
# Mises à jour des dépendances proposées par GitHub (SPEC § 18.29).
# Une fois par mois, regroupées : une pull request par famille au plus, pour
# ne pas dépenser de minutes de CI (SPEC § 18.24). Les failles de sécurité
# connues ouvrent une pull request tout de suite, hors calendrier.
version: 2
updates:
  # Modules Go du projet (agent, serveur, outils).
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 2
    groups:
      go:
        patterns: ["*"]

  # Banc d'essai du stockage (module à part).
  - package-ecosystem: gomod
    directory: /bancs/stockage
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      go-bancs:
        patterns: ["*"]

  # Actions de la CI (checkout, setup-go, docker…), épinglées par SHA de
  # commit avec la version en commentaire : Dependabot met à jour les deux.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]

  # Image de base du Dockerfile (golang), épinglée par empreinte sha256 :
  # Dependabot met à jour le tag et l'empreinte.
  - package-ecosystem: docker
    directory: /deploy/serveur
    schedule: { interval: monthly }
    open-pull-requests-limit: 1

  # Image du docker-compose (daemon Olvid), épinglée de même (revue du 28/11).
  - package-ecosystem: docker-compose
    directory: /deploy/serveur
    schedule: { interval: monthly }
    open-pull-requests-limit: 1
