# CI de mirador-stack (SPEC.md § 11.1, § 101)
#
# À chaque push sur une branche (une seule fois par commit) : formatage,
# go vet, tests (avec détection des accès concurrents), fuzzing, gosec,
# govulncheck, licences, compilation amd64 / arm64, image Docker.
# Les versions (tags v*) sont publiées par le workflow « Release »
# (release.yml), qui vérifie que ce workflow a RÉUSSI sur le commit publié
# (sans le relancer).
# Les outils sont figés à une version précise ; chaque tâche a une durée
# maximale (une tâche bloquée ne mange pas le forfait).
#
# Économie de minutes (11/11 : 90 % du forfait mensuel utilisé ; 20/11 :
# ~20 min facturées par push mesurées) :
#   - branches : contrôles (compilation amd64 seulement) et tests ;
#     fuzzing, image Docker et compilation arm64 seulement sur main (après
#     la fusion, avant toute release) et le dimanche (fuzzing plus long) :
#     un push de branche passe de ~20 à ~8 min facturées ;
#   - un push qui ne touche que la documentation ne lance rien ;
#   - 5 tâches au lieu de 8 (GitHub arrondit CHAQUE tâche à la minute ;
#     le fuzzing est en 2 tâches depuis le 19/11 pour aller plus vite) ;
#   - test de sauvegarde / restauration plus lancé deux fois ;
#   - benchmarks seulement à la demande (Actions › CI › Run workflow).
# Durée totale ~4 min (celle des tests et d'un lot de fuzzing).
#
# Économie de stockage (15-16/11 : les 0,5 Go du mois remplis par les
# binaires de 42 Mo envoyés à chaque push et gardés 30 jours) :
#   - plus d'artefact de binaires : les machines s'installent depuis les
#     versions publiées (Releases, à chaque tag), qui ne comptent pas ;
#   - plus d'enregistrement de la construction Docker (artefact
#     « .dockerbuild » gardé 90 jours) ;
#   - workflow « nettoyage » : supprime chaque lundi ce qui resterait.

name: CI

# Un seul passage par commit : « push » suffit (le résultat s'affiche aussi
# dans la pull request) ; avant, push + pull_request lançaient tout deux fois.
on:
  push:
    # Branches seulement : un tag est traité par « Release ».
    branches: ['**']
    # Documentation seule : rien à vérifier (ne s'applique pas aux tags).
    # Exception : THIRD-PARTY.md est contrôlé par la CI (licences) ; le
    # corriger doit donc la relancer. L'ordre compte : la dernière ligne qui
    # correspond l'emporte.
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!reference/**'
      - 'THIRD-PARTY.md'
  # Chaque dimanche sur main : tout, avec un fuzzing plus long (1 min par cible).
  schedule:
    - cron: '41 2 * * 0'
  # Lancement à la main (avec les benchmarks si demandé).
  workflow_dispatch:
    inputs:
      benchmarks:
        description: "Lancer aussi les benchmarks"
        type: boolean
        default: false

# Un nouveau push sur une branche annule le passage encore en cours sur
# cette branche (inutile de finir l'ancien). Sur main, jamais : chaque
# commit de main doit avoir une CI terminée (la release la vérifie).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.4
  GOSEC_VERSION: v2.30.0
  GOVULNCHECK_VERSION: v1.9.0

jobs:
  # Les tâches tournent EN PARALLÈLE : la durée totale est celle de la plus
  # longue (les tests), pas leur somme.

  controles:
    name: Formatage, Licences, Gosec, Govulncheck, Compilation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Formatage, Go vet, Licences
        run: make verif
      - name: Gosec
        run: go run github.com/securego/gosec/v2/cmd/gosec@${GOSEC_VERSION} -quiet -exclude-generated ./...
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION} ./...
      # Branches : amd64 seulement ; main (et lancements à la main ou du
      # dimanche) : amd64 et arm64.
      - name: Compilation (Agent, Collecteur et Serveur Linux, Mirador-release Windows)
        env:
          ARCHS: ${{ (github.event_name == 'push' && github.ref != 'refs/heads/main') && 'amd64' || 'amd64 arm64' }}
        run: make agent collecteur serveur release ARCHS="$ARCHS"
      # Pas d'artefact : les binaires d'une version sont dans sa Release.

  tests:
    name: Tests (accès concurrents compris)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Comprend la sauvegarde / restauration de bout en bout
      # (TestSauvegardeRestauration, internal/server).
      - name: Tests
        run: go test -race ./...

  # Fuzzing : à chaque envoi sur une branche (pas pour un tag : le commit
  # étiqueté est déjà passé par ici). 16 cibles × 15 s, coupées en DEUX
  # tâches parallèles de 8 cibles (19/11) : seule, la tâche durait 6 min 15
  # et ralentissait toute la CI ; en deux, ~3 min 15 chacune, moins que les
  # tests (durée totale ~6 min 45 → ~4 min, pour ~1 min de forfait en plus).
  # Chaque ligne : paquet:Cible.
  fuzzing:
    name: Fuzzing court (${{ matrix.lot }})
    # main, dimanche, lancement à la main : pas sur les autres branches.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - lot: Agent
            cibles: >-
              ./internal/agent/config:FuzzLire
              ./internal/agent/collect:FuzzLecturesProc
              ./internal/agent/racine:FuzzAnalyses
              ./internal/agent/journal:FuzzAnalyser
              ./internal/agent/logs:FuzzMasquerEtJSON
              ./internal/agent/dockerlogs:FuzzMultiplexe
              ./internal/agent/distant:FuzzDecoder
              ./internal/collecteur/syslog:FuzzSyslog
          - lot: Serveur
            cibles: >-
              ./internal/server/ingestion:FuzzDecoderRemoteWrite
              ./internal/server/ingestion:FuzzDecoderJsonline
              ./internal/server/ingestion:FuzzDecoderInflux
              ./internal/server/stockage/journaux:FuzzLireEntete
              ./internal/server/sauvegarde:FuzzLecture
              ./internal/server/alertes:FuzzImporter
              ./internal/server/alertes:FuzzExpr
              ./internal/server/notif:FuzzCible
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Fuzzing court (15 s par cible, 1 min le dimanche)
        env:
          CIBLES: ${{ matrix.cibles }}
          DUREE: ${{ github.event_name == 'schedule' && '60s' || '15s' }}
        run: |
          set -eu
          for c in $CIBLES; do
            echo "::group::${c}"
            go test "${c%%:*}" -run XXX -fuzz "^${c##*:}\$" -fuzztime "$DUREE"
            echo "::endgroup::"
          done

  # Benchmarks (pour information) : seulement à la demande.
  benchmarks:
    name: Benchmarks
    if: github.event_name == 'workflow_dispatch' && inputs.benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Benchmarks
        run: go test -run XXX -bench . -benchmem -benchtime 500x ./...

  # Image Docker du serveur : construite et essayée à chaque envoi sur une
  # branche (le Dockerfile est vérifié), EN MÊME TEMPS que les tests ; rien
  # n'est publié (publication : workflow « Release »).
  image:
    name: Image Docker (construction et essai)
    # main, dimanche, lancement à la main : pas sur les autres branches.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Construction
        uses: docker/build-push-action@v7
        env:
          # Pas d'artefact « .dockerbuild » (gardé 90 jours, stockage compté).
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: deploy/serveur/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: mirador-server:essai
          # Cache des couches (modules Go téléchargés) entre deux exécutions.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=dev-${{ github.sha }}
            COMMIT=${{ github.sha }}

      - name: Essai de l'image construite (démarrage, santé, arrêt)
        run: |
          set -euo pipefail
          mkdir -p essai && cd essai
          # Clé lisible seulement par l'utilisateur du conteneur (le serveur
          # refuse une clé lisible par tous).
          openssl rand -base64 32 > cle && sudo chown 65532:65532 cle && sudo chmod 0400 cle
          # MIRADOR_PROXY : obligatoire quand l'écoute sort de la machine
          # (ici la passerelle du réseau Docker par défaut).
          printf 'MIRADOR_ECOUTE_AGENTS=0.0.0.0:9440\nMIRADOR_ECOUTE_INTERFACE=0.0.0.0:9441\nMIRADOR_PROXY=172.17.0.1\n' > server.conf
          docker run -d --name essai --read-only --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/server.conf:/etc/mirador/server.conf:ro" -v "$PWD/cle:/run/secrets/mirador_cle:ro" \
            mirador-server:essai
          for i in $(seq 1 30); do
            etat=$(docker inspect -f '{{.State.Health.Status}}' essai)
            [ "$etat" = healthy ] && break
            sleep 2
          done
          docker logs essai
          [ "$(docker inspect -f '{{.State.Health.Status}}' essai)" = healthy ]
          docker exec essai /mirador-server -config /etc/mirador/server.conf sauvegarder
          docker exec essai /mirador-server -config /etc/mirador/server.conf sauvegardes
          docker stop essai
