# Release de mirador-stack (SPEC.md § 101, demande du 20/11)
#
# Deux façons de publier une version :
#   - bouton : Actions › Release › Run workflow (sur main), saisir la version
#     (ex. 0.6.0) : le workflow vérifie qu'elle est plus récente que la
#     dernière, pose le tag v0.6.0 sur le commit, puis publie ;
#   - tag : poser le tag vX.Y.Z (GitHub › Releases › Draft a new release, ou
#     git push du tag) : même publication.
#
# Étapes : préparation (version vérifiée ; commit déjà dans main, revue du
# 28/11) → vérification que la CI a RÉUSSI sur ce commit exact (elle n'est
# pas relancée : retour du 20/11, minutes économisées ; si elle tourne
# encore, on attend sa fin) → en parallèle :
#   - binaires : tag posé (bouton), agent, collecteur et mirador-maj-serveur
#     SIGNÉS (amd64, arm64), serveur (sans Docker), mirador-release
#     (Windows, Linux), SHA256SUMS ; Release GitHub avec notes générées
#     depuis les pull requests ;
#   - image : ghcr.io/prohand/mirador-server:X.Y.Z (et :latest pour une
#     version finale) ;
# puis signature de l'image : son empreinte (sha256:…) est signée et jointe
# à la Release (mirador-server-image-X.Y.Z.manifeste.json). C'est ce que
# vérifie mirador-maj-serveur sur le VPS avant toute mise à jour depuis
# l'interface (SPEC § 102).
# Rien n'est publié sans une CI réussie sur ce commit. Commit sans CI
# (documentation seule) : Actions › CI › Run workflow sur main, puis
# relancer la release.
#
# Réglages GitHub conseillés (revue du 28/11) : ruleset sur les tags v*
# (création, déplacement et suppression réservés aux administrateurs) et
# relecteur obligatoire sur l'environnement « signature ».
#
# Secrets (environnement « signature », limité aux tags v* et à main) :
#   MIRADOR_CLE_SIGNATURE : contenu de cle-mirador.json (chiffré)
#   MIRADOR_PHRASE        : sa phrase de passe
# Sans ces secrets (ex. un fork) : binaires publiés sans signature.
# La clé privée n'est jamais dans le dépôt.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. 0.6.0, sans « v »)"
        required: true
        type: string
      brouillon:
        description: "Release en brouillon (à publier ensuite à la main)"
        type: boolean
        default: false

# Une seule publication à la fois, jamais annulée en cours de route.
concurrency:
  group: publication-version
  cancel-in-progress: false

permissions:
  contents: read

env:
  GOTOOLCHAIN: go1.27.4

jobs:
  preparation:
    name: Préparation (version)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      precedent: ${{ steps.version.outputs.precedent }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # fetch-depth 0 : tout l'historique, toutes les branches (origin/main)
      # et tous les tags.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Revue du 28/11 (B18) : pour un tag poussé comme pour le bouton, le
      # commit publié doit déjà être dans main (fusionné par pull request).
      # Un tag posé sur un commit d'une branche non fusionnée est refusé.
      - name: Commit fusionné dans main
        run: |
          set -euo pipefail
          if ! git rev-parse -q --verify refs/remotes/origin/main >/dev/null; then
            echo "::error::Branche main introuvable dans la copie du dépôt"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Le commit $GITHUB_SHA n'est pas dans main : fusionner la pull request d'abord, puis poser le tag sur un commit de main"
            exit 1
          fi
          echo "Commit $GITHUB_SHA présent dans main"
      - name: Version, vérifications et tag
        id: version
        env:
          SAISIE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            v="${SAISIE#v}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          # X.Y.Z, avec un suffixe facultatif (0.6.0-rc1 = préversion).
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version invalide : « $v » (attendu X.Y.Z, ex. 0.6.0)"
            exit 1
          fi
          tag="v$v"
          precedent=$(git tag -l 'v*' --sort=-v:refname | grep -vxF "$tag" | head -n 1 || true)
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Lancer la release depuis la branche main (pas $GITHUB_REF_NAME)"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Le tag $tag existe déjà"
              exit 1
            fi
            if [ -n "$precedent" ] && [ "$(printf '%s\n%s\n' "${precedent#v}" "$v" | sort -V | tail -n 1)" != "$v" ]; then
              echo "::error::$tag n'est pas plus récente que la dernière version ($precedent)"
              exit 1
            fi
          fi
          prerelease=false
          case "$v" in *-*) prerelease=true ;; esac
          {
            echo "version=$v"
            echo "tag=$tag"
            echo "precedent=$precedent"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "### Version $tag (précédente : ${precedent:-aucune})" >> "$GITHUB_STEP_SUMMARY"

  verification:
    name: CI réussie sur ce commit
    needs: preparation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # lire les passages de la CI
    steps:
      - name: Attente et vérification du résultat de la CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          # Passage le plus récent de la CI pour ce commit (tout événement :
          # push de la branche, de main, ou lancement à la main).
          for i in $(seq 1 60); do
            ligne=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=5" \
              --jq '.workflow_runs | sort_by(.created_at) | reverse | .[0] | select(. != null) | [.status, (.conclusion // ""), .html_url] | @tsv')
            if [ -z "$ligne" ]; then
              echo "::error::Aucune CI pour $sha (commit de documentation seule ?). Lancer Actions › CI › Run workflow sur main, puis relancer la release."
              exit 1
            fi
            IFS=$'\t' read -r etat conclusion lien <<< "$ligne"
            if [ "$etat" = completed ]; then
              if [ "$conclusion" = success ]; then
                echo "CI réussie pour $sha : $lien" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error::La CI de ce commit n'a pas réussi ($conclusion) : $lien. Corriger, puis publier une nouvelle version."
              exit 1
            fi
            echo "CI encore en cours ($etat), nouvel essai dans 15 s… ($lien)"
            sleep 15
          done
          echo "::error::CI toujours en cours après 15 min pour $sha"
          exit 1

  binaires:
    name: Binaires signés et Release GitHub
    needs: [preparation, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: signature
    permissions:
      contents: write # créer la Release et y ajouter les fichiers
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
      TAG: ${{ needs.preparation.outputs.tag }}
    steps:
      # Bouton : le tag n'est posé qu'ici, une fois la CI vérifiée (un échec
      # avant ne laisse pas de tag derrière lui). Jeton du workflow : le tag
      # ne relance aucun workflow.
      - name: Tag de la version (bouton)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          echo "Tag $TAG posé sur $GITHUB_SHA" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compilation (Agent, Collecteur, Serveur, Mirador-release, Mirador-maj-serveur)
        run: |
          set -eu
          make agent collecteur serveur release majserveur VERSION="$VERSION"
          cd dist
          for a in amd64 arm64; do
            mv "mirador-maj-serveur-linux-$a" "mirador-maj-serveur-$VERSION-linux-$a"
            mv "mirador-agent-linux-$a" "mirador-agent-$VERSION-linux-$a"
            mv "mirador-collector-linux-$a" "mirador-collector-$VERSION-linux-$a"
            mv "mirador-server-linux-$a" "mirador-server-$VERSION-linux-$a"
          done
          mv mirador-release-windows-amd64.exe "mirador-release-$VERSION-windows-amd64.exe"
          mv mirador-release-linux-amd64 "mirador-release-$VERSION-linux-amd64"
      # mirador-maj-serveur aussi (revue du 28/11, M3) : son manifeste est
      # vérifié par installer-maj-serveur.sh avant l'installation en root.
      - name: Signature de l'agent, du collecteur et de mirador-maj-serveur
        env:
          MIRADOR_CLE_SIGNATURE: ${{ secrets.MIRADOR_CLE_SIGNATURE }}
          MIRADOR_PHRASE: ${{ secrets.MIRADOR_PHRASE }}
        run: |
          set -eu
          if [ -z "${MIRADOR_CLE_SIGNATURE:-}" ] || [ -z "${MIRADOR_PHRASE:-}" ]; then
            echo "::warning::Secrets MIRADOR_CLE_SIGNATURE / MIRADOR_PHRASE absents : agent, collecteur et mirador-maj-serveur publiés SANS signature (pas de mise à jour automatique possible)"
            exit 0
          fi
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$MIRADOR_CLE_SIGNATURE" > "$d/cle.json"
          go build -o "$d/mirador-release" ./cmd/mirador-release
          for a in amd64 arm64; do
            "$d/mirador-release" signer -cle "$d/cle.json" -version "$VERSION" -arch "$a" "dist/mirador-agent-$VERSION-linux-$a"
            "$d/mirador-release" signer -cle "$d/cle.json" -produit mirador-collector -version "$VERSION" -arch "$a" "dist/mirador-collector-$VERSION-linux-$a"
            "$d/mirador-release" signer -cle "$d/cle.json" -produit mirador-maj-serveur -version "$VERSION" -arch "$a" "dist/mirador-maj-serveur-$VERSION-linux-$a"
          done
      - name: Empreintes (SHA256SUMS)
        run: |
          set -eu
          cd dist
          rm -f SHA256SUMS
          sha256sum mirador-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release GitHub (notes générées depuis les pull requests)
        env:
          GH_TOKEN: ${{ github.token }}
          PRECEDENT: ${{ needs.preparation.outputs.precedent }}
          PRERELEASE: ${{ needs.preparation.outputs.prerelease }}
          BROUILLON: ${{ inputs.brouillon }}
        run: |
          set -eu
          entete=$(cat <<NOTES
          ## Mettre à jour

          1. **Serveur** : interface › *Réglages* › *Mise à jour du serveur* (avec mirador-maj-serveur sur le VPS), ou à la main : \`docker pull ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirador-server:${VERSION}\` puis redémarrer le conteneur (docs/administration-serveur.md).
          2. **Agents** : interface › *Mises à jour des agents* › *Importer une version signée depuis GitHub* › \`${TAG}\`, puis assigner la version (d'abord à une machine).

          ## Fichiers

          - \`mirador-agent-${VERSION}-linux-amd64/arm64\` et \`mirador-collector-…\` : signés (\`.manifeste.json\`).
          - \`mirador-server-${VERSION}-linux-amd64/arm64\` : serveur sans Docker.
          - \`mirador-server-image-${VERSION}.manifeste.json\` : empreinte signée de l'image Docker du serveur.
          - \`mirador-maj-serveur-${VERSION}-linux-amd64/arm64\` : mise à jour du serveur depuis l'interface (sur le VPS), signé (\`.manifeste.json\`). Script d'installation, épinglé sur le commit de cette version : \`curl -fsSLO https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/deploy/serveur/installer-maj-serveur.sh\`
          - \`mirador-release-${VERSION}-windows-amd64.exe\` / \`-linux-amd64\` : outil de signature.
          - \`SHA256SUMS\` : empreintes de tous les fichiers.
          NOTES
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Release déjà créée à la main (GitHub › Releases) : ses notes sont gardées.
            echo "Release $TAG existante : fichiers ajoutés"
          else
            options=(--verify-tag --title "mirador $TAG" --notes "$entete" --generate-notes)
            [ -n "$PRECEDENT" ] && options+=(--notes-start-tag "$PRECEDENT")
            [ "$PRERELEASE" = true ] && options+=(--prerelease)
            [ "$BROUILLON" = true ] && options+=(--draft)
            gh release create "$TAG" "${options[@]}"
          fi
          gh release upload "$TAG" dist/mirador-* dist/SHA256SUMS --clobber
          echo "Release : https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Image Docker publiée
    needs: [preparation, verification]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      empreinte: ${{ steps.publication.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Connexion à ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Étiquettes (X.Y.Z, et latest pour une version finale)
        id: etiquettes
        env:
          VERSION: ${{ needs.preparation.outputs.version }}
          PRERELEASE: ${{ needs.preparation.outputs.prerelease }}
        run: |
          set -eu
          base="ghcr.io/${GITHUB_REPOSITORY_OWNER}/mirador-server"
          tags="$base:$VERSION"
          [ "$PRERELEASE" = true ] || tags="$tags,$base:latest"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - name: Construction et publication
        id: publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
          DOCKER_BUILD_SUMMARY: false
        with:
          context: .
          file: deploy/serveur/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.etiquettes.outputs.tags }}
          # Pas de cache pour une version publiée : le cache est aussi écrit
          # par les branches (revue de sécurité du 11/11).
          no-cache: true
          build-args: |
            VERSION=${{ needs.preparation.outputs.version }}
            COMMIT=${{ github.sha }}

  signature-image:
    name: Signature de l'image (Release)
    needs: [preparation, binaires, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: signature
    permissions:
      contents: write # ajouter le manifeste à la Release
    env:
      VERSION: ${{ needs.preparation.outputs.version }}
      TAG: ${{ needs.preparation.outputs.tag }}
      EMPREINTE: ${{ needs.image.outputs.empreinte }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Manifeste signé de l'image
        env:
          MIRADOR_CLE_SIGNATURE: ${{ secrets.MIRADOR_CLE_SIGNATURE }}
          MIRADOR_PHRASE: ${{ secrets.MIRADOR_PHRASE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ -z "${MIRADOR_CLE_SIGNATURE:-}" ] || [ -z "${MIRADOR_PHRASE:-}" ]; then
            echo "::warning::Secrets de signature absents : image non signée (pas de mise à jour du serveur depuis l'interface)"
            exit 0
          fi
          if ! printf '%s' "$EMPREINTE" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
            echo "::error::Empreinte de l'image invalide : « $EMPREINTE »"
            exit 1
          fi
          umask 077
          d=$(mktemp -d)
          trap 'rm -rf -- "$d"' EXIT
          printf '%s' "$MIRADOR_CLE_SIGNATURE" > "$d/cle.json"
          go build -o "$d/mirador-release" ./cmd/mirador-release
          m="mirador-server-image-$VERSION.manifeste.json"
          "$d/mirador-release" signer-image -cle "$d/cle.json" -version "$VERSION" -empreinte "$EMPREINTE" -sortie "$d/$m"
          gh release upload "$TAG" "$d/$m" --clobber --repo "$GITHUB_REPOSITORY"
          echo "Image signée : $EMPREINTE" >> "$GITHUB_STEP_SUMMARY"
