{{define "contenu"}}

{{end}}</div>
<h2 class="titre-section">Ailleurs dans mirador</h2>

<div class="grille">
{{range pagesLieesReglages}}<a class="carte lien-carte secondaire" href="{{.Href}}"><span class="pastille">{{.Ou}}</span><h2>{{.Titre}}</h2><small>{{.Aide}}</small></a>
{{end}}</div>
{{end}}
