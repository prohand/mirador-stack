# SPDX-License-Identifier: GPL-3.0-or-later
#
# mirador-server sur le VPS, à côté de la stack actuelle (SPEC.md § 16.2).
# Même principe que la stack « obs » : aucun port publié, nginx (sur l'hôte)
# joint le conteneur par son IP fixe sur le réseau Docker « obs ».
#
# Avant le premier lancement (dans le dossier de ce fichier) :
#   mkdir -p config secrets
#   openssl rand -base64 32 > secrets/mirador_cle && chmod 0400 secrets/mirador_cle
#   chown 65532:65532 secrets/mirador_cle
#   cp server.conf.exemple config/server.conf
#   chown 65532:65532 config/server.conf && chmod 0400 config/server.conf
#
# Mise à jour depuis l'interface (facultatif, SPEC § 102) : une fois,
#   sudo ./installer-maj-serveur.sh --version X.Y.Z --cle-publique CLE
# (docs/administration-serveur.md › Mise à jour du serveur depuis l'interface).
#
# Olvid (facultatif, SPEC § 18.13) : daemon officiel du bot, lancé seulement
# avec le profil « olvid ». Clé admin dans .env (0600), puis assistant dans
# l'interface (Réglages › Notifications › Olvid › assistant) :
#   echo "OLVID_ADMIN_CLIENT_KEY_CLI=$(openssl rand -hex 32)" >> .env && chmod 600 .env
#   docker compose --profile olvid up -d

name: mirador

services:
  mirador-server:
    # Version figée (pas « latest »), dans le .env : MIRADOR_IMAGE et
    # MIRADOR_VERSION. mirador-maj-serveur les change lors d'une mise à jour
    # depuis l'interface (image désignée par son empreinte signée, SPEC § 102).
    image: ${MIRADOR_IMAGE:-ghcr.io/prohand/mirador-server:0.5.0}
    container_name: mirador-server
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 300m
    cpus: 1.0
    pids_limit: 200
    environment:
      TZ: Europe/Paris
      # Plafond souple du ramasse-miettes Go (SPEC § 16.1), sous mem_limit.
      GOMEMLIMIT: 200MiB
      # Ramasse-miettes plus fréquent : −10 Mo mesurés sous charge, CPU
      # inchangé (SPEC § 17.9, réponse du 10/11).
      GOGC: "50"
    volumes:
      - mirador-donnees:/var/lib/mirador
      - ./config/server.conf:/etc/mirador/server.conf:ro
      # Mise à jour depuis l'interface (SPEC § 102) : le serveur y dépose sa
      # demande (dossier à 65532), et lit l'état écrit par mirador-maj-serveur
      # (dossier à root, en lecture seule ici).
      - ./maj:/var/lib/mirador-maj
      - ./maj-etat:/var/lib/mirador-maj-etat:ro
    secrets: [mirador_cle]
    networks:
      obs:
        ipv4_address: 172.30.0.20   # exemple : une adresse libre de VOTRE réseau

  # Daemon Olvid : aucun port publié ; mirador le joint par son nom
  # (mirador-olvid:50051) sur le réseau obs. ~170 Mio mesurés (SPEC § 17.10).
  mirador-olvid:
    # Version figée, et empreinte vérifiée le 28/11 (un tag peut être
    # republié) ; Dependabot (docker) met à jour les deux.
    image: olvid/bot-daemon:2.0.1@sha256:1d8a70f49894a406e3e021ccffde46d48a5c2add58a99ff9e6bf8c683292a25f
    container_name: mirador-olvid
    profiles: [olvid]
    restart: unless-stopped
    # Revue du 28/11 : refus de démarrer avec une clé admin vide (le daemon
    # serait lancé sans clé connue). Pas de « ${VAR:?} » dans le compose :
    # Docker Compose l'évalue pour TOUS les services, même hors profil, et
    # mirador ne démarrerait plus sans Olvid. Le test est donc fait dans le
    # conteneur, puis le lanceur d'origine de l'image (./daemon.sh) est
    # appelé tel quel. « $$ » : un « $ » laissé au shell du conteneur.
    entrypoint:
      - /bin/sh
      - -c
      - '[ -n "$$OLVID_ADMIN_CLIENT_KEY_CLI" ] || { echo "OLVID_ADMIN_CLIENT_KEY_CLI vide : ajouter la clé admin au .env (voir en tête de ce fichier)" >&2; exit 1; }; exec ./daemon.sh "$$@"'
      - daemon.sh
    environment:
      OLVID_ADMIN_CLIENT_KEY_CLI: ${OLVID_ADMIN_CLIENT_KEY_CLI:-}
      JAVA_TOOL_OPTIONS: "-Xmx128m"
    volumes:
      - olvid-donnees:/daemon/data        # identité du bot : à sauvegarder
      - olvid-sauvegardes:/daemon/backups
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 300
    # Revue du 28/11 : aucune capacité Linux. L'image lance « java » en root
    # (uid 0), sans changement d'utilisateur ni chown (daemon.sh vérifié), et
    # écoute sur 50051 (> 1024) : aucune capacité n'est nécessaire. Les
    # fichiers des volumes appartiennent à root, qui les écrit toujours.
    # Pas de read_only : les dossiers où Java et le daemon écrivent hors des
    # volumes (/tmp, dossier personnel…) n'ont pas pu être vérifiés sans
    # lancer l'image ; à essayer plus tard (read_only + tmpfs /tmp).
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging:
      options: { max-size: "10m", max-file: "3" }
    networks: [obs]

volumes:
  mirador-donnees:
  olvid-donnees:
  olvid-sauvegardes:

secrets:
  mirador_cle:
    file: ./secrets/mirador_cle

networks:
  obs:
    external: true   # réseau Docker existant (exemple : 172.30.0.0/24, à adapter)
